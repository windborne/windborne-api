name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    outputs:
      secrets_found: ${{ steps.count.outputs.secrets_found }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      - name: Write org-wide allowlist
        run: |
          cat > .gitleaks.toml << 'GITLEAKS_EOF'
          [extend]
          useDefault = true

          [allowlist]
          paths = [
              '''db/structure\.sql''',
              '''db/schema\.rb''',
              '''routesforllms\.txt''',
              '''\.sarif$''',
          ]
          regexes = [
              '''pk\.eyJ1''',
              '''YOUR_API_KEY''',
              '''YOUR_CLIENT_ID''',
          ]
          GITLEAKS_EOF

      - name: Run Gitleaks
        id: scan
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --exit-code 2
        continue-on-error: true

      - name: Count findings
        id: count
        if: always()
        run: |
          if [ -f gitleaks-results.sarif ]; then
            COUNT=$(jq '[.runs[].results[]] | length' gitleaks-results.sarif 2>/dev/null || echo 0)
          else
            COUNT=0
          fi
          echo "secrets_found=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
        continue-on-error: true

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif

      - name: Fail if secrets found
        if: steps.scan.outcome == 'failure'
        run: exit 1

  trufflehog:
    name: TruffleHog (Verified Secrets)
    runs-on: ubuntu-latest
    outputs:
      secrets_found: ${{ steps.count.outputs.secrets_found }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        id: scan
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          extra_args: --only-verified
        continue-on-error: true

      - name: Set result
        id: count
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" = "failure" ]; then
            echo "secrets_found=1" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_found=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if secrets found
        if: steps.scan.outcome == 'failure'
        run: exit 1
